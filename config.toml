[daemon]
poll_interval_seconds = 60
status_interval_seconds = 900   # How often to log a "still idle" heartbeat when caught up (default 15m)
max_emails_per_cycle = 10       # Override per-run with the MAX_EMAILS_PER_CYCLE env var
gmail_query = "in:inbox -label:agent/processed -label:agent/attempted"
# Max characters of thread transcript sent to the classifier. Kept modest
# because the local model prefills the WHOLE transcript before answering:
# tens-of-thousands-of-char threads take minutes to prefill on consumer
# hardware and can blow the local request timeout. Oldest messages are dropped
# first when a thread exceeds this (see format_thread_transcript).
max_thread_chars = 16000
cloud_parallel = 2
# Max concurrent local MLX requests. Defaults to 1: each concurrent request
# adds a full KV cache on top of the model weights, and long email transcripts
# make those caches multi-GB. Concurrent long-transcript requests can exceed
# the GPU's Metal working set (~75% of unified memory) and OOM-crash the
# server. Raise it via the LOCAL_PARALLEL env var ONLY if the model plus N
# concurrent KV caches fit the GPU working set (tune the server's
# --prompt-cache-size, and/or raise iogpu.wired_limit_mb); keep it <= 8
# (mlx-lm has a KV-cache cross-contamination bug at 16+ concurrent requests).
local_parallel = 1
# Max concurrent Gmail thread fetches (get_thread). Bounds the proxy-read burst
# when max_emails_per_cycle is large; the cloud/local semaphores gate only the
# downstream classify calls, not the fetch.
fetch_parallel = 4
# Max concurrent label-application writes (modify_message via apply_classification /
# mark_processed / mark_attempted / apply_newsletter_classification). Bounds the
# proxy-WRITE burst when max_emails_per_cycle is large (e.g. draining a backlog).
# Separate from fetch_parallel because writes may block on human approval
# (WRITE_TIMEOUT, 300s), so the sizing tradeoff differs. Override: WRITE_PARALLEL.
write_parallel = 4
# How many strikes a thread takes before it is set aside under agent/attempted.
# Only failures the cycle-level attribution blames on the thread itself count
# (decision D5 Rule 2): a failure signature unique among the cycle's candidates,
# with at least one sibling that succeeded — or a cycle in which this thread was
# the only one that attempted anything, the adjudicated singleton edge and the
# usual shape of a poison thread (everything else has processed away). So 5 is 5
# such cycles: long enough to ride out a bad afternoon, short enough that a
# genuinely poison thread stops burning LLM spend within minutes of polling.
# The same number is the masquerade escalation threshold: after this many
# cycles of provider-shaped failures on one thread while siblings succeed, the
# daemon starts shouting about it (that thread is retried forever, never
# abandoned). Override: MAX_FAILURES.
max_failures = 5
healthcheck_file = "/tmp/healthcheck"

[labels]
needs_response = "agent/needs-response"
fyi = "agent/fyi"
low_priority = "agent/low-priority"
processed = "agent/processed"
attempted = "agent/attempted"   # applied on give-up (repeated failures); excluded from gmail_query
personal = "agent/personal"
non_personal = "agent/non-personal"

[labels.actions]
needs_response = "inbox"
fyi = "inbox"
low_priority = "archive"

[llm.cloud]
model = "zai-org/glm-5"
# Native thinking stays ENABLED here — deliberately asymmetric with
# [llm.local]. glm-5 emits no in-content chain-of-thought at all (the <think>
# instruction in the prompts is dead weight for it), so its accuracy rides
# entirely on the native reasoning channel — and issue #64's probes showed
# disabling it changes labels. Disable only behind an eval gate (issue #13).
# Unlike the local tier, the budget is not squeezed: the same fixtures that
# exhausted qwen's 1024 finished in 204-486 completion tokens here (2-5x
# headroom — measured on 5 probe fixtures, so monitoring-grade evidence, not
# proof under service-heavy traffic). If a squeeze ever develops, it now fails
# loudly: llm_client raises on finish_reason "length" with the real
# diagnostics, so watch the logs for LLMContentError naming this model.
max_tokens = 1024
temperature = 0
timeout = 60

[llm.local]
model = "{env.MLX_MODEL}"
# 4096, not 1024: with native thinking disabled, the model still emits the full
# step-by-step scaffold the prompt asks for — as untagged prose in content,
# label last — and observed demand ran to ~1,300 completion tokens on hard
# threads (issue #64). An over-budget decode truncates content before the label
# is emitted; llm_client raises LLMContentError on finish_reason "length" (and
# a keyword-free reply that reaches the parser raises there — since D5 Rule 1
# there is no LOW_PRIORITY → archive default left to land in), but
# that backstop makes an undersized budget loud rather than cheap: a lone
# over-budget thread strikes out to agent/attempted, and several co-failing
# over-budget threads share a signature and are held as shared-cause (D5) —
# deferred every cycle, backlog kept. Either way the budget must fit the
# honest demand. This raise is therefore coupled to the thinking disable
# below, not independent tuning.
# NOTE: this also quadruples the per-request decode budget each concurrent
# local request's KV cache can grow into. The documented LOCAL_PARALLEL
# ceiling ("keep ≤ 8", README-technical "Local Model Serving & Memory") was
# calibrated under the old 1024-token decode — re-confirm the model + N KV
# caches fit the GPU's Metal budget before raising LOCAL_PARALLEL above 1.
max_tokens = 4096
temperature = 0
timeout = 180
# Extra fields merged verbatim into the top level of every API request body.
# Native thinking must be OFF on the local person-email classifier: the #10
# eval showed it strictly worse (reasoning overruns the max_tokens budget in
# the separate channel and no label is emitted), and issue #64 reproduced that
# exact failure in production under Ollama. The disable dialect is
# backend-specific, so BOTH known forms are sent:
#   - reasoning_effort = "none" is the form Ollama (verified on 0.32.5) honors
#     on its OpenAI-compatible endpoint. Only "none" disables — "low" is a
#     silent no-op there, and think=false / chat_template_kwargs are ignored.
#   - chat_template_kwargs.enable_thinking = false is the form mlx_lm.server
#     and LM Studio honor (Ollama ignores it). Kept for portability back to
#     those backends; issue #64's probes sent both fields together against
#     Ollama without harm.
# Never use Qwen's /no_think prompt switch instead: it emitted a stray closing
# think-tag into content that _strip_thinking cannot remove (issue #64).
[llm.local.extra_body]
reasoning_effort = "none"

[llm.local.extra_body.chat_template_kwargs]
enable_thinking = false

[prompts.sender_classification]
system = """You are an email classifier. Your job is to determine whether an email is from a real person or from an automated service/company.

Classify the sender as one of:
- PERSON: A real human being writing a personal or professional email (colleagues, friends, family, business contacts)
- SERVICE: An automated email, newsletter, marketing, notification, receipt, shipping update, social media notification, or any email from a company/service

Respond with ONLY one word: PERSON or SERVICE

Think about it carefully before answering. Use <think> tags to reason about the sender, then give your final answer."""

user_template = """From: {sender}
Subject: {subject}
Preview: {snippet}"""

[vip_senders]
# VIP addresses come from VIP_SENDERS env var (comma-separated).
# These are always classified as PERSON (skips sender LLM call)
# and restricted to VIP-only categories (skips low-priority).
categories = ["NEEDS_RESPONSE", "FYI"]

[prompts.email_classification]
preamble = """You are an email classifier. Based on the full email content, classify it into exactly one of three categories.

Use this decision process:
1. Is this a calendar invitation (event invite, RSVP, "you have been invited")? If yes → NEEDS_RESPONSE
2. Does this email specifically require {env.USER_NAME} personally to respond, take action, or make a decision? (Group announcements that mention tasks or action items for a team don't count — only emails directed specifically at {env.USER_NAME}.) If yes → NEEDS_RESPONSE
3. If the sender is a real person, the email is at least FYI unless it is unsolicited sales, partnership, or cold outreach from someone with no existing relationship, which is LOW_PRIORITY. A person's mail is never LOW_PRIORITY for any other reason, even if it seems unimportant.
4. If the sender is a service and no action is needed: is it worth reading for awareness? Payment receipts, transaction confirmations, and curated editorial newsletters (not automated product updates or account alerts) are worth reading. If yes → FYI. Otherwise → LOW_PRIORITY

Important: Unsolicited outreach from unfamiliar senders — including sales pitches, partnership proposals, cold introductions, and requests to "hop on a call" from people {env.USER_NAME} does not know — is LOW_PRIORITY, even if it contains a question or call to action.

Categories:"""

postamble = """Think step by step before answering. Use <think> tags to reason about the email:
1. Who is this from? Is this someone {env.USER_NAME} likely knows or works with?
2. Is there a specific action or response needed from {env.USER_NAME}?
3. If no action is needed, is the content worth reading for situational awareness?

Then give your final answer: NEEDS_RESPONSE, FYI, or LOW_PRIORITY"""

user_template = """From: {sender}
Subject: {subject}
Thread transcript:
{body}"""

[prompts.email_classification.categories]
NEEDS_RESPONSE = "The email requires a reply, decision, or action from {env.USER_NAME}. Examples: direct questions from colleagues or contacts, meeting requests, invitations needing RSVP, requests for information or approval. Note: 'Let me know if you have any questions' (or similar) does not by itself require a response. Cold emails and sales pitches do NOT qualify, even if they ask a question."
FYI = "The email is informational and worth reading but requires no action. Examples: status updates from colleagues, team announcements, shared articles from contacts, policy updates, organizational news, event recaps, forwarded information relevant to {env.USER_NAME}'s work."
LOW_PRIORITY = "The email has low importance or is unwanted. Examples: marketing newsletters, automated notifications, social media digests, promotional offers, spam, unsolicited sales or partnership pitches, cold outreach, phishing attempts, subscription digests. Anything that does not need to be read."

[newsletter]
recipient = "newsletters@dm.org"
output_file = "data/newsletter_assessments.jsonl"

[newsletter.llm]
model = "claude-sonnet-4-6"
# 4096, not 1024: story_extraction re-emits the FULL text of every story in a
# single response, so output scales with newsletter size — 1024 truncated
# multi-story newsletters mid-story. llm_client now raises LLMContentError on
# finish_reason "length" (issue #64) instead of silently parsing a truncated
# story list, so an undersized budget here fails loudly rather than mis-grading:
# a lone over-budget newsletter strikes out to agent/attempted, and several
# co-failing over-budget newsletters share a signature and are held as
# shared-cause (D5) — deferred every cycle, backlog kept. Sized by that
# reasoning (issue #64's Fix 4); this tier has not been live-probed.
# NOTE: max_tokens is part of the eval cache key (evals/llm_cache.py), so
# changing it invalidates every cached newsletter response and the next
# newsletter_run re-bills the whole golden set — while prompt_hash (prompts
# only) stays identical, so pre/post-change runs are NOT distinguishable by
# hash. Budget changes deserve a note alongside the A/B comparison.
max_tokens = 4096
temperature = 0
# 180, not 60: a full-budget 4096-token Sonnet decode at typical non-streaming
# throughput (~50-80 tok/s) runs 50-80+ seconds — the old 60s bound only fit
# responses capped at 1024 tokens. A timeout here is a strike candidate — the
# cycle attribution counts it only when it blames this newsletter (D5), so a
# newsletter that keeps timing out alone ends at agent/attempted while several
# timing out together are held as shared cause — so the timeout must contain
# the decode the max_tokens budget above allows.
timeout = 180


[newsletter.labels]
newsletter = "agent/newsletter"
excellent = "agent/newsletter/excellent"
good = "agent/newsletter/good"
fair = "agent/newsletter/fair"
poor = "agent/newsletter/poor"
no_stories = "agent/newsletter/no-stories"

[newsletter.labels.themes]
scripture = "agent/newsletter/theme/scripture"
christlikeness = "agent/newsletter/theme/christlikeness"
church = "agent/newsletter/theme/church"
vocation_family = "agent/newsletter/theme/vocation-family"
disciple_making = "agent/newsletter/theme/disciple-making"

[newsletter.prompts.story_extraction]
system = """You are a newsletter analyst. Given a ministry newsletter email, extract each distinct story from the content.

A "story" is a narrative segment about people, events, or ministry activities. Skip non-story content like:
- Headers, footers, signatures
- Donation appeals or fundraising asks
- Event calendar listings
- Administrative announcements
- Contact information

For each story, provide the full text of the story as it appears in the newsletter.

Respond in this exact format (one story per block, separated by blank lines):

STORY: [full story text]

If the newsletter contains no stories, respond with exactly: NO_STORIES"""

user_template = """Newsletter content:
{body}"""

[newsletter.prompts.quality_assessment]
system = """You are a writing quality assessor for ministry newsletter stories. For each of four storytelling dimensions, judge how well this story demonstrates that dimension using a three-value rubric:

- POOR: The story does not display this dimension of storytelling in any meaningful way.
- OK: The story displays this dimension, but only partially or inconsistently. There is significant room for improvement.
- GOOD: The story consistently displays this dimension. While not necessarily perfect, it could serve as an example of what this dimension means.

The dimensions:
- SIMPLE: Does the story focus on one key idea or progression, with no tangents or extraneous details?
- CONCRETE: Does the story narrate particular events involving particular people at particular times and places, with vivid specifics rather than abstractions?
- PERSONAL: Does the story center on one person or a few people, such that what matters to them is what matters to the story — rather than events, numbers, or ideas disconnected from people?
- DYNAMIC: Does the story describe how a person changes over time — a clear arc of transformation rather than a static account with no before-and-after?

Think step by step about each dimension. Use <think> tags for your reasoning, then respond in this exact format:

SIMPLE: [POOR|OK|GOOD]
CONCRETE: [POOR|OK|GOOD]
PERSONAL: [POOR|OK|GOOD]
DYNAMIC: [POOR|OK|GOOD]"""

user_template = """Story text:
{text}"""

[newsletter.prompts.theme_classification]
system = """You are a ministry theme classifier. Given a story from a ministry newsletter, judge to what degree it illustrates each theme from the organization's Ends Statement, using a three-value rubric:

- ABSENT: The theme is not present in the story at all.
- PRESENT: The theme is present, but underdeveloped.
- EMPHASIZED: The theme is well-developed and highlighted in the story.

The Ends Statement themes are:

- SCRIPTURE: Study the Scriptures correctly, apply them to all of life, and teach them to others
- CHRISTLIKENESS: Exhibit increasing Christlikeness in response to the Gospel. Look for a specific person growing in character, attitude, or behavior in a way that reflects Christ — not merely faith or spiritual activity mentioned in passing.
- CHURCH: A college student actively participates in or serves at a local church (not just a campus fellowship). Look for substantial involvement in a local church community during college; a passing mention of attending church or a church name does not qualify.
- VOCATION_FAMILY: Honor God in their vocation and family relationships
- DISCIPLE_MAKING: Continue to make disciples wherever God takes them

Do not force a match. A theme is EMPHASIZED only when it is a substantial part of what the story is about; PRESENT when it appears but is underdeveloped; otherwise ABSENT.

Think step by step. Use <think> tags for your reasoning, then respond with one line per theme in this exact format:

SCRIPTURE: [ABSENT|PRESENT|EMPHASIZED]
CHRISTLIKENESS: [ABSENT|PRESENT|EMPHASIZED]
CHURCH: [ABSENT|PRESENT|EMPHASIZED]
VOCATION_FAMILY: [ABSENT|PRESENT|EMPHASIZED]
DISCIPLE_MAKING: [ABSENT|PRESENT|EMPHASIZED]"""

user_template = """Story text:
{text}"""
